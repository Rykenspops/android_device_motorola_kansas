name: Recovery Cloud Compiler

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'AOSP / TWRP Manifest Link'
        required: true
        default: 'https://github.com'
      MANIFEST_BRANCH:
        description: 'Manifest Branch (e.g. twrp-12.1)'
        required: true
        default: 'twrp-12.1'
      DEVICE_NAME:
        description: 'Target Device Codename'
        required: true
        default: 'kansas'
      MAKEFILE_TARGET:
        description: 'Build Target Prefix'
        required: true
        default: 'twrp'

jobs:
  compile-recovery:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space Engine
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Initialize Environment Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y universe
        sudo add-apt-repository -y multiverse
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc bison build-essential curl git git-lfs gnupg zip lz4 libncurses-dev libssl-dev python3 python3-pip rsync tmux repo
        sudo chmod a+x /usr/bin/repo

    - name: Configure Git Workspace
      run: |
        git config --global user.name "Rykenspops"
        git config --global user.email "rykenspops@gmail.com"

    - name: Download Build Manifests
      run: |
        mkdir workspace
        cd workspace
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Embed Device Tree Configuration
      uses: actions/checkout@v4
      with:
        path: workspace/device/motorola/${{ github.event.inputs.DEVICE_NAME }}

    - name: Compile Recovery Image Target
      run: |
        cd workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_TARGET }}_${{ github.event.inputs.DEVICE_NAME }}-eng
        mka recoveryimage -j$(nproc --all)

    - name: Extract and Rename Artifacts
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        mv recovery.img ${{ github.event.inputs.MAKEFILE_TARGET }}_${{ github.event.inputs.DEVICE_NAME }}_recovery.img
        echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

    - name: Upload Binaries to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.MAKEFILE_TARGET }}_${{ github.event.inputs.DEVICE_NAME }}_recovery.img
        name: Custom Recovery Compilation - ${{ env.BUILD_DATE }}
        tag_name: recovery-${{ env.BUILD_DATE }}
        body: |
          Cloud compilation output completed successfully.
          Target Architecture: Motorola Moto G 5G (kansas)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
